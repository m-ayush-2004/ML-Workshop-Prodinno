[project]
name = "prodinno-ml-workshop"
version = "1.0.0"
description = "Prodinno ML Workshop — one-day seminar notebooks and capstone project"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.18",
    "missingno>=0.5.2",
    "imbalanced-learn>=0.12",
    "shap>=0.45",
    "lime>=0.2.0.1",
    "joblib>=1.3",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "nbformat>=5.10",
    "nbconvert>=7.16",
    "streamlit>=1.32",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
    "requests>=2.31",
    "openpyxl>=3.1",
]

[tool.setuptools]
py-modules = []
